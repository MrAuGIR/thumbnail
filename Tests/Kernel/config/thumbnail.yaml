thumbnail:
    # NF2 presentation-layer fallback (used by ServeThumbnailController in the functional test).
    placeholder: '%kernel.project_dir%/Tests/images/test.jpg'
    fallback: source
    cache_control: 'public, max-age=31536000, immutable'
    converters:
        convert_vignette:
            binary: "convert"
            configuration:
                prefix: "thumb_240x24_"
                ext: "jpeg"
                options:
                    - { name: "-resize", value: "240x24"}
                outputPath: "public/assets/thumbnail/"
        convert_screen_shot:
            binary: "convert"
            configuration:
                prefix: "thumb_1024x800_"
                ext: "jpeg"
                options:
                    - { name: "-resize", value: "1024x800" }
                    - { name: "-q", value: "80" }
                outputPath: "public/assets/thumbnail/"
    chains:
        chain_web:
            - 'convert_vignette'
            - 'convert_screen_shot'