services:
    _defaults:
        autowire: true
        autoconfigure: true

    MrAuGir\Thumbnail\Processor\:
        resource: '../../Processor/*'

    MrAuGir\Thumbnail\Action\:
        resource: '../../Action/*'
        exclude:
            - '../../Action/Input/'
            - '../../Action/Output/'
        tags: ['controller.service_arguments']

    MrAuGir\Thumbnail\Converter\:
        resource: '../../Converter/*'

    MrAuGir\Thumbnail\ImageFileManager:
        arguments:
            $allowedHosts: '%thumbnail.allowed_hosts%'
            $fetchTimeout: '%thumbnail.fetch_timeout%'
            $maxFileSize: '%thumbnail.max_file_size%'

    MrAuGir\Thumbnail\Factory\ImageFactory:
        arguments:
            $imageFileManager: '@MrAuGir\Thumbnail\ImageFileManager'

    MrAuGir\Thumbnail\Action\ServeThumbnailController:
        arguments:
            $placeholder: '%thumbnail.placeholder%'
            $fallback: '%thumbnail.fallback%'
            $cacheControl: '%thumbnail.cache_control%'
        tags: ['controller.service_arguments']

    MrAuGir\Thumbnail\Engine:
        arguments:
            $processTimeout: '%thumbnail.process_timeout%'
        tags: ['mraugir.thumbnail.engine']

    MrAuGir\Thumbnail\EngineInterface: '@MrAuGir\Thumbnail\Engine'